name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service
          POSTGRES_PASSWORD: service-test-password
          POSTGRES_DB: service_orders_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U service -d service_orders_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://service:service-test-password@localhost:5432/service_orders_test
      JWT_SECRET_KEY: test-only-secret-that-is-longer-than-32-characters
      CORS_ORIGINS: http://localhost:5173
      PROVIDER_MODE: local
      PROVIDER_WEBHOOK_SECRET: test-webhook-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-admin.txt
      - run: python -m admin.migrations.runner
      - run: pytest -q
      - run: python -m compileall -q admin admin_app.py app.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev
